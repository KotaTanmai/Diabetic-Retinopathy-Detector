
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retinopathy Dashboard</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #101426;
            color: white;
        }

        h1 {
            text-align: center;
            color: #8da9ff;
        }

        .subtitle {
            text-align: center;
            color: #b7bfd7;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin: 35px auto;
            max-width: 1000px;
        }

        .card, .chart {
            background: #202944;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
        }

        .card h2 {
            color: #91aaff;
            font-size: 30px;
        }

        .charts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1100px;
            margin: auto;
        }

        .chart img {
            width: 100%;
            border-radius: 10px;
            background: white;
        }

        a {
            display: block;
            width: fit-content;
            margin: 35px auto;
            padding: 13px 25px;
            background: #526dfe;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .note {
            text-align: center;
            color: #aeb8d0;
            font-size: 13px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <h1>Diabetic Retinopathy Dashboard</h1>
    <p class="subtitle">CNN Model Performance Analysis</p>

    <div class="cards">
        <div class="card">
            <h3>Accuracy</h3>
            <h2>90.55%</h2>
        </div>

        <div class="card">
            <h3>Precision</h3>
            <h2>90.5%</h2>
        </div>

        <div class="card">
            <h3>Recall</h3>
            <h2>90.5%</h2>
        </div>

        <div class="card">
            <h3>F1 Score</h3>
            <h2>90.5%</h2>
        </div>
    </div>

    <div class="charts">
        <div class="chart">
            <h2>Confusion Matrix</h2>
            <img src="{{ url_for('static', filename='results/confusion_matrix.png') }}" 
                 alt="Confusion Matrix">
        </div>

        <div class="chart">
            <h2>Performance Metrics</h2>
            <img src="{{ url_for('static', filename='results/performance_metrics.png') }}"
                 alt="Performance Metrics">
        </div>
    </div>

    <p class="note">
        Educational prototype only. This application is not a medical diagnosis tool.
    </p>

    <a href="/">Back to Image Prediction</a>

</body>
</html>
